<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CFST · Cloudflare 测速 Web 控制台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot" id="statusDot"></span>
    <strong>CFST 测速控制台</strong>
    <span class="sub">Rust Core · Web UI · 亚当小嘉嘉</span>
  </div>
  <div class="topbar-right">
    <span class="stat" id="statResult">结果 0</span>
    <span class="stat" id="statRunning">就绪</span>
    <button class="btn ghost sm" id="btnReportCfg" title="上报配置">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<main class="layout">
  <!-- 参数面板 -->
  <aside class="panel">
    <div class="field">
      <label class="field-label-row">
        <span>直接指定 IP 段 <span class="hint">--ip</span></span>
        <span class="label-btns">
          <button type="button" class="clear-field" id="btnPickIpFile">选择文件</button>
          <button type="button" class="clear-field" id="btnClearIpText">清空</button>
        </span>
      </label>
      <input type="file" id="inIpFile" accept=".txt,text/plain" class="hidden">
      <textarea id="inIpText" rows="3" placeholder="104.16.0.0/12&#10;1.1.1.0/24&#10;2606:4700::/32"></textarea>
      <em class="note" id="ipFileName">按照换行符分隔多个 IP 段；也可点右上角「选择文件」读入本地 txt</em>
    </div>

    <div class="grid2">
      <div class="field">
        <label>延迟并发数 <span class="hint">-n</span></label>
        <input type="number" id="inRoutines" min="1" max="1000" value="200">
      </div>
      <div class="field">
        <label>每 IP 次数 <span class="hint">-t</span></label>
        <input type="number" id="inPingTimes" min="1" max="20" value="4">
      </div>
      <div class="field">
        <label>测速端口 <span class="hint">--tp</span></label>
        <input type="number" id="inPort" min="1" max="65535" value="443">
      </div>
      <div class="field">
        <label>显示数量 <span class="hint">-p</span></label>
        <input type="number" id="inPrintNum" min="0" max="1000" value="10">
      </div>
    </div>

    <div class="field">
      <label>测速地址 <span class="hint">--url</span></label>
      <input type="text" id="inUrl" placeholder="https://speed.cloudflare.com/__down?bytes=99000000">
      <em class="note">延迟（HTTPing 模式）与下载测速都用它</em>
    </div>

    <div class="field">
      <label>延迟测速模式</label>
      <div class="seg" id="segPing">
        <button class="on" data-ping="tcp">TCPing</button>
        <button data-ping="http">HTTPing</button>
      </div>
      <em class="note" id="pingNote">TCP 握手，快；HTTPing 能识别地区码</em>
    </div>

    <div class="grid2 httping-only hidden">
      <div class="field">
        <label>有效状态码 <span class="hint">--httping-code</span></label>
        <input type="number" id="inHttpCode" min="0" max="599" value="0">
      </div>
      <div class="field">
        <label>地区码过滤 <span class="hint">--cfcolo</span></label>
        <input type="text" id="inColo" placeholder="HKG,SJC">
      </div>
    </div>

    <div class="grid3">
      <div class="field">
        <label>延迟上限 ms <span class="hint">--tl</span></label>
        <input type="number" id="inMaxDelay" min="0" value="9999">
      </div>
      <div class="field">
        <label>延迟下限 ms <span class="hint">--tll</span></label>
        <input type="number" id="inMinDelay" min="0" value="0">
      </div>
      <div class="field">
        <label>丢包上限 <span class="hint">--tlr</span></label>
        <input type="number" id="inLoss" min="0" max="1" step="0.1" value="1">
      </div>
    </div>

    <div class="field">
      <label>下载测速</label>
      <div class="seg" id="segDl">
        <button class="on" data-dl="on">测下载速度</button>
        <button data-dl="off">跳过</button>
      </div>
      <em class="note">跳过 = --dd，只出延迟结果</em>
    </div>

    <div class="grid3">
      <div class="field">
        <label>测速节点数量 <span class="hint">--dn</span></label>
        <input type="number" id="inDnNum" min="1" value="10">
      </div>
      <div class="field">
        <label>测速时间 s <span class="hint">--dt</span></label>
        <input type="number" id="inDnTime" min="1" value="10">
      </div>
      <div class="field">
        <label>最低速度 MB/s <span class="hint">--sl</span></label>
        <input type="number" id="inMinSpeed" min="0" step="0.1" value="0">
      </div>
    </div>

    <div class="field">
      <label>输出文件 <span class="hint">-o</span></label>
      <input type="text" id="inOutput" value="result.csv">
    </div>

    <div class="checks">
      <label class="check"><input type="checkbox" id="inAllIp"> 测速全部 IP <span class="hint">--allip</span></label>
      <label class="check"><input type="checkbox" id="inDebug"> 调试输出 <span class="hint">--debug</span></label>
    </div>

    <div class="actions">
      <button class="btn primary" id="btnStart">
        <svg viewBox="0 0 24 24" class="ico"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        开始测速
      </button>
      <button class="btn danger hidden" id="btnStop">
        <svg viewBox="0 0 24 24" class="ico"><rect x="6" y="6" width="12" height="12"/></svg>
        停止
      </button>
    </div>

    <div class="cli-preview">
      <label>等价命令行参数</label>
      <code id="cliArgs">（读默认配置）</code>
    </div>
  </aside>

  <div class="resize-handle" id="sidebarResize" role="separator" aria-label="调整侧栏宽度" aria-orientation="vertical" tabindex="0"></div>

  <!-- 结果区 -->
  <section class="content">
    <div class="progress" id="progressBar"><i id="progressFill"></i></div>
    <div class="statusline"><span id="statusText">就绪，配置左侧参数后开始</span></div>

    <div class="toolbar">
      <input type="text" id="filterText" placeholder="筛选 IP 或地区码" autocomplete="off">
      <span class="spacer"></span>
      <button class="btn ghost" id="btnCopyAll" title="复制全部结果，格式 IP:端口#地区-速度">
        <svg viewBox="0 0 24 24" class="ico"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        复制节点
      </button>
      <button class="btn ghost" id="btnExport" title="导出 CSV">
        <svg viewBox="0 0 24 24" class="ico"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        导出 CSV
      </button>
      <button class="btn ghost" id="btnUploadWorker" title="上报到 Worker">
        <svg viewBox="0 0 24 24" class="ico"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        上报 Worker
      </button>
      <button class="btn ghost" id="btnUploadGH" title="上传到 GitHub">
        <svg viewBox="0 0 24 24" class="ico"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
        GitHub
      </button>
    </div>

    <div class="table-wrap">
      <table id="tbl">
        <thead>
          <tr>
            <th class="c-idx">#</th>
            <th data-sort="ip">IP</th>
            <th class="c-num" data-sort="sent">已发送</th>
            <th class="c-num" data-sort="received">已接收</th>
            <th class="c-num" data-sort="loss">丢包率</th>
            <th class="c-num" data-sort="delay">平均延迟</th>
            <th class="c-num" data-sort="speed">下载速度</th>
            <th data-sort="colo">地区码</th>
            <th class="c-act"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="emptyBox">还没有测速结果</div>
    </div>

    <div class="logbox">
      <div class="loghead">
        <strong>实时日志</strong>
        <span class="spacer"></span>
        <button class="btn ghost sm" id="btnClearLog">清空</button>
      </div>
      <div class="logbody" id="logBody"></div>
    </div>
  </section>
</main>

<!-- 上报配置弹窗 -->
<div class="mask hidden" id="mask">
  <div class="modal">
    <h3>上报配置</h3>
    <div class="field">
      <label>Worker 域名</label>
      <input type="text" id="cfgDomain" placeholder="example.workers.dev">
    </div>
    <div class="field">
      <label>UUID 或自定义路径</label>
      <input type="text" id="cfgUUID" placeholder="访问面板用的那串">
    </div>
    <hr>
    <div class="field">
      <label>GitHub 仓库</label>
      <input type="text" id="cfgRepo" placeholder="owner/repo">
    </div>
    <div class="field">
      <label>GitHub Token <span class="hint" id="tokenHint"></span></label>
      <input type="password" id="cfgToken" placeholder="留空则沿用已保存的">
    </div>
    <div class="field">
      <label>仓库内文件路径</label>
      <input type="text" id="cfgPath" placeholder="cloudflare_ips.txt">
    </div>
    <div class="field">
      <label>上报数量</label>
      <input type="number" id="cfgLimit" placeholder="留空上传全部" min="1" max="1000">
    </div>
    <label class="check"><input type="checkbox" id="cfgClear" checked> 上报前清空 Worker 已有 IP</label>
    <div class="modal-actions">
      <button class="btn ghost" id="btnCfgClose">取消</button>
      <button class="btn primary" id="btnCfgSave">保存</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>

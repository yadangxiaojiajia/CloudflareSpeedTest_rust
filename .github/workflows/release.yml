name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x64
            bin: project-c.exe
            pack: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x64
            bin: project-c
            pack: targz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-arm64
            bin: project-c
            pack: targz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: macos-x64
            bin: project-c
            pack: targz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 编译 release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 打包
        shell: bash
        run: |
          mkdir -p dist
          NAME="project-c-${GITHUB_REF_NAME}-${{ matrix.asset }}"
          if [ "${{ matrix.pack }}" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'target/${{ matrix.target }}/release/${{ matrix.bin }}' -DestinationPath 'dist/${NAME}.zip'"
          else
            tar -czf "dist/${NAME}.tar.gz" -C "target/${{ matrix.target }}/release" "${{ matrix.bin }}"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: asset-${{ matrix.asset }}
          path: dist/*

  publish:
    name: 发行 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: assets
          merge-multiple: true

      - name: 查看产物
        run: ls -lh assets

      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
